name: Claim UID review validation
on:
  push:
    branches: [ci/claim-uid-review-20261121]
permissions:
  contents: read
jobs:
  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      GOMAXPROCS: '4'
      GOMEMLIMIT: 4GiB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: SDK tests and unfixed baseline
        run: python .github/claim-uid-validation.py sdk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: claim-uid-python-${{ matrix.python }}
          path: _artifacts/
          if-no-files-found: error
